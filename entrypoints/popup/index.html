<!DOCTYPE html>
<html>
<head>
  <title>YouTube Focus</title>
  <style>
    body {
      width: 240px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    h3 {
      font-size: 13px;
      margin: 14px 0 6px 0;
      color: #555;
      font-weight: 600;
    }
    .option {
      margin: 8px 0;
      display: flex;
      align-items: center;
    }
    label {
      cursor: pointer;
      user-select: none;
      font-size: 14px;
    }
    input[type="checkbox"] {
      margin-right: 8px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 4px 6px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .field {
      margin: 6px 0;
    }
    .field-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 3px;
    }
    #status {
      font-size: 12px;
      color: green;
      margin-top: 10px;
      height: 15px;
    }
  </style>
</head>
<body>
  <h2>YouTube Focus</h2>
  <div class="option">
    <label>
      <input type="checkbox" id="hideShorts" checked>
      Hide Shorts
    </label>
  </div>
  <div class="option">
    <label>
      <input type="checkbox" id="hidePlayables" checked>
      Hide Playables
    </label>
  </div>

  <h3>Language Learning</h3>
  <div class="option">
    <label>
      <input type="checkbox" id="dualSubtitlesEnabled">
      Show secondary subtitle
    </label>
  </div>
  <div class="field" id="secondaryLanguageField">
    <div class="field-label">Secondary language</div>
    <select id="secondaryLanguage">
      <option value="en">English</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="pt">Portuguese</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="zh-Hans">Chinese (Simplified)</option>
      <option value="zh-Hant">Chinese (Traditional)</option>
      <option value="ru">Russian</option>
      <option value="vi">Vietnamese</option>
      <option value="hi">Hindi</option>
      <option value="ar">Arabic</option>
      <option value="it">Italian</option>
      <option value="__other__">Other (BCP-47)…</option>
    </select>
    <input
      type="text"
      id="secondaryLanguageOther"
      placeholder="e.g. nl, sv, tr"
      style="display: none; margin-top: 6px;"
    >
  </div>

  <div id="status"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
