<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Focus &amp; Learn</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f1f1f;
      --fg-muted: #5f6368;
      --fg-soft: #80868b;
      --border: #e5e5e5;
      --accent: #1a73e8;
      --hover-bg: #f5f5f5;
      --status: #137333;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --fg: #e8eaed;
        --fg-muted: #bdc1c6;
        --fg-soft: #9aa0a6;
        --border: #3c4043;
        --accent: #8ab4f8;
        --hover-bg: #2a2b2e;
        --status: #81c995;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
    }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      padding: 14px 16px 12px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    .section {
      padding: 12px 16px;
    }
    .section + .section {
      border-top: 1px solid var(--border);
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-soft);
      margin: 0 0 8px;
    }
    .option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
    }
    .option input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
    }
    .option label {
      cursor: pointer;
      user-select: none;
      flex: 1;
      color: var(--fg);
    }
    .field {
      margin-top: 8px;
    }
    .field-label {
      font-size: 11px;
      color: var(--fg-muted);
      margin-bottom: 4px;
    }
    .field-hint {
      font-size: 11px;
      color: var(--fg-soft);
      margin-top: 6px;
      line-height: 1.35;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      font-family: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s;
    }
    select:hover, input[type="text"]:hover {
      border-color: var(--fg-soft);
    }
    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }
    input[type="text"] {
      margin-top: 6px;
    }
    .count-pill {
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--fg-muted);
      background: var(--hover-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 8px;
      min-width: 24px;
      text-align: center;
      user-select: none;
    }
    #status {
      font-size: 11px;
      color: var(--status);
      padding: 0 16px;
      height: 16px;
      line-height: 16px;
      transition: opacity 0.2s;
    }
    .footer {
      border-top: 1px solid var(--border);
      padding: 6px;
      display: flex;
      gap: 4px;
    }
    .footer a {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--fg-muted);
      text-decoration: none;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .footer a:hover {
      background: var(--hover-bg);
      color: var(--fg);
    }
    .footer .icon {
      font-size: 13px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="header">YouTube Focus &amp; Learn</div>

  <div class="section">
    <div class="section-title">Language Learning</div>
    <div class="option">
      <input type="checkbox" id="dualSubtitlesEnabled">
      <label for="dualSubtitlesEnabled">Show secondary subtitle</label>
    </div>
    <div class="field" id="secondaryLanguageField">
      <div class="field-label">Default secondary language</div>
      <select id="secondaryLanguage">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="pt">Portuguese</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh-Hans">Chinese (Simplified)</option>
        <option value="zh-Hant">Chinese (Traditional)</option>
        <option value="ru">Russian</option>
        <option value="vi">Vietnamese</option>
        <option value="hi">Hindi</option>
        <option value="ar">Arabic</option>
        <option value="it">Italian</option>
        <option value="__other__">Other (BCP-47)…</option>
      </select>
      <input type="text" id="secondaryLanguageOther" placeholder="e.g. nl, sv, tr" style="display: none;">
      <div class="field-hint">Tip: switch the language for any video from the CC2 menu in YouTube's player settings.</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Reduce Distractions</div>
    <div class="option">
      <input type="checkbox" id="hideShorts">
      <label for="hideShorts">Hide Shorts</label>
      <span class="count-pill" id="shortsHiddenCount" hidden>0</span>
    </div>
    <div class="option">
      <input type="checkbox" id="hidePlayables">
      <label for="hidePlayables">Hide Playables</label>
      <span class="count-pill" id="playablesHiddenCount" hidden>0</span>
    </div>
  </div>

  <div id="status"></div>

  <div class="footer">
    <a href="https://chromewebstore.google.com/detail/youtube-focus/dppgailgbpncddkeccgfiplmdonfloja/reviews" target="_blank" rel="noopener noreferrer">
      <span class="icon">★</span>
      <span>Rate</span>
    </a>
    <a href="https://buymeacoffee.com/songsterq" target="_blank" rel="noopener noreferrer">
      <span class="icon">☕</span>
      <span>Donate</span>
    </a>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
